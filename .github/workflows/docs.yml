# Publishes the rendered documentation archive attached to a public Release.
name: Documentation site

on:
  release:
    types: [published]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'sync-dev-org/pixtreme' && !startsWith(github.event.release.tag_name, 'v1.')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download the documentation archive
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/sync-dev-org/pixtreme/releases/download/${RELEASE_TAG}/pixtreme-docs-${RELEASE_TAG}.tar.gz" \
            --output site.tar.gz
          mkdir site
          tar --extract --gzip --file site.tar.gz --directory site --no-same-owner --no-same-permissions
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
