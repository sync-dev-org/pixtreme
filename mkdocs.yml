site_name: pixtreme 1.2.0
site_description: GPU-first image processing for Python, built on CUDA and CuPy
docs_dir: docs_site
repo_url: https://github.com/sync-dev-org/pixtreme
repo_name: sync-dev-org/pixtreme
strict: true

theme:
  name: material
  language: en
  features:
    - navigation.sections

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - src
          options:
            docstring_style: google
            members: true
            members_order: source
            show_root_heading: true
            show_root_full_path: false
            show_source: false
            show_if_no_docstring: true
            signature_crossrefs: true
